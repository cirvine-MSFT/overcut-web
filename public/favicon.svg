<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Overcut">
	<title>Overcut</title>
	<mask id="cut">
		<rect width="32" height="32" fill="#fff" />
		<rect x="-8" y="14.4" width="48" height="3.2" fill="#000" transform="rotate(-14 16 16)" />
	</mask>
	<rect width="32" height="32" rx="6" fill="#08090b" />
	<circle
		cx="16"
		cy="16"
		r="9"
		fill="none"
		stroke="#f5f7fa"
		stroke-width="3.5"
		mask="url(#cut)"
	/>
	<rect x="4" y="15.4" width="24" height="1.4" fill="#ff5c2b" transform="rotate(-14 16 16)" />
</svg>
